<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>促销政策查询</title>
<style>
:root {
  --primary:#00897B;--primary-dark:#00695C;--primary-light:#4DB6AC;--accent:#43A047;--accent-light:#66BB6A;
  --bg:#eef5f1;--bg-tint:#e0f0e8;--card:#ffffff;--text:#1a2e25;--text-sub:#3d5a4e;--text-light:#7a9388;
  --border:#d4e6dc;--border-light:#e8f0ec;
  --shadow:0 2px 12px rgba(0,137,123,.08);
  --shadow-hover:0 4px 20px rgba(0,137,123,.16);
  --shadow-card:0 1px 6px rgba(0,60,50,.06);
  --radius:14px;--radius-sm:10px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.65;-webkit-font-smoothing:antialiased;padding-bottom:44px}

/* 顶部头部的渐变绿色 */
.header{background:linear-gradient(145deg,#00897B 0%,#00695C 55%,#005449 100%);color:#fff;padding:18px 18px 16px;position:sticky;top:0;z-index:100;box-shadow:0 4px 20px rgba(0,105,92,.28)}
.header::before{content:"";position:absolute;top:0;left:0;right:0;bottom:0;background:radial-gradient(circle at 85% 20%,rgba(255,255,255,.08) 0,transparent 50%);pointer-events:none}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;position:relative}
.header-title{font-size:20px;font-weight:700;letter-spacing:1.5px;text-shadow:0 1px 4px rgba(0,0,0,.12)}
.header-sub{font-size:11.5px;opacity:.82;margin-top:3px;letter-spacing:.5px}
.badge-count{background:rgba(255,255,255,.18);backdrop-filter:blur(4px);padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;border:1px solid rgba(255,255,255,.15)}

/* 搜索框 - 精致磨砂风格 */
.search-wrap{position:relative}
.search-input{width:100%;height:46px;border:none;border-radius:23px;padding:0 46px 0 20px;font-size:15px;background:rgba(255,255,255,.95);outline:none;box-shadow:0 3px 12px rgba(0,0,0,.12);letter-spacing:.3px}
.search-input::placeholder{color:var(--text-light)}
.search-input:focus{background:#fff;box-shadow:0 4px 16px rgba(0,137,123,.2)}
.search-icon{position:absolute;right:18px;top:50%;transform:translateY(-50%);color:var(--primary);font-size:16px}
.search-clear{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:#fff;background:var(--primary-light);width:22px;height:22px;border-radius:50%;text-align:center;line-height:22px;font-size:12px;display:none;cursor:pointer;transition:transform .2s}
.search-clear:active{transform:translateY(-50%) scale(.85)}

/* 筛选区 */
.filter-section{background:#fff;padding:10px 0 8px;border-bottom:1px solid var(--border)}
.filter-row{padding:0 14px 5px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;white-space:nowrap}
.filter-row::-webkit-scrollbar{display:none}
.filter-label{font-size:10.5px;color:var(--text-light);padding:5px 10px 3px;font-weight:600;letter-spacing:1px;text-transform:uppercase}

/* 筛选标签 - 精致胶囊按钮 */
.tab{display:inline-block;padding:6px 16px;border-radius:18px;font-size:13px;font-weight:500;background:#f4f8f6;color:var(--text-sub);border:1px solid var(--border);cursor:pointer;margin-right:7px;transition:all .25s ease}
.tab:active{transform:scale(.94)}
.tab.active{background:linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%);color:#fff;border-color:var(--primary-dark);box-shadow:0 2px 8px rgba(0,137,123,.3)}
.tab.act-active{background:linear-gradient(135deg,var(--accent) 0%,#388E3C 100%);color:#fff;border-color:#388E3C;box-shadow:0 2px 8px rgba(67,160,71,.3)}

/* 快捷品牌标签 */
.quick-tags{display:flex;gap:7px;flex-wrap:wrap;padding:10px 14px 6px}
.quick-tag{font-size:12px;color:var(--primary-dark);background:var(--bg-tint);padding:5px 12px;border-radius:14px;cursor:pointer;border:1px solid var(--border);white-space:nowrap;transition:all .2s}
.quick-tag:active{transform:scale(.92);background:var(--primary);color:#fff}

/* 结果区 */
.results{padding:8px 14px}
.result-info{font-size:12px;color:var(--text-light);padding:6px 4px 10px;letter-spacing:.3px}

/* 商品卡片 */
.card{background:var(--card);border-radius:var(--radius);padding:15px 17px;margin-bottom:11px;box-shadow:var(--shadow-card);transition:all .2s;border:1px solid var(--border-light)}
.card:active{box-shadow:var(--shadow-hover);transform:translateY(-1px)}
.card-header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.card-left{flex:1;min-width:0}
.card-name{font-size:15.5px;font-weight:600;color:var(--text);margin-bottom:4px;word-break:break-all;letter-spacing:.3px}
.card-meta{font-size:11px;color:var(--text-light);display:flex;gap:10px;flex-wrap:wrap}

/* 品类标签 */
.tag{display:inline-block;padding:3px 9px;border-radius:6px;font-size:10.5px;font-weight:600;color:#fff;flex-shrink:0;letter-spacing:.5px}
.tag-水饮料{background:linear-gradient(135deg,#26A69A,#00897B)}
.tag-酒类{background:linear-gradient(135deg,#FFA726,#FB8C00)}
.tag-茶叶{background:linear-gradient(135deg,#66BB6A,#43A047)}
.tag-粮油副食{background:linear-gradient(135deg,#AB47BC,#8E24AA)}
.tag-百货{background:linear-gradient(135deg,#26C6DA,#00ACC1)}
.tag-食品{background:linear-gradient(135deg,#EC407A,#D81B60)}
.tag-生鲜食品{background:linear-gradient(135deg,#FF7043,#F4511E)}
.tag-汽车用品{background:linear-gradient(135deg,#5C6BC0,#3949AB)}
.tag-其他{background:linear-gradient(135deg,#78909C,#546E7A)}

/* 活动列表 */
.activity-list{margin-top:11px;padding-top:9px;border-top:1px dashed var(--border)}
.activity-row{display:flex;align-items:flex-start;gap:8px;padding:6px 0;font-size:13px;border-bottom:1px solid var(--border-light)}
.activity-row:last-child{border-bottom:none}
.act-name{flex-shrink:0;font-weight:600;color:var(--text);min-width:82px;font-size:12px}
.act-info{flex:1;color:var(--text-sub);font-size:12px}
.act-price{color:var(--primary-dark);font-weight:700;font-size:14px}
.act-orig{color:var(--text-light);text-decoration:line-through;font-size:11px;margin-left:5px}
.act-discount{display:inline-block;background:#e8f5e9;color:#2E7D32;padding:1px 7px;border-radius:4px;font-size:10px;font-weight:700;margin-left:5px}
.act-remark{font-size:11px;color:var(--text-light);margin-top:3px;line-height:1.5}
.act-badge{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:600;margin-left:5px}
.act-badge.必选{background:#ffebee;color:#c62828}
.act-badge.主推{background:#e8f5e9;color:#2E7D32}
.act-badge.新增{background:#e3f2fd;color:#1565C0}
.act-badge.延续{background:#f3e5f5;color:#7B1FA2}

/* 空状态 */
.empty{text-align:center;padding:56px 20px;color:var(--text-light)}
.empty .emoji{font-size:44px;margin-bottom:12px}
.empty p{font-size:14px}

/* 底部 */
.footer{text-align:center;padding:22px 16px;font-size:11px;color:var(--text-light);line-height:1.9;letter-spacing:.3px}

/* 多活动标记 */
.mark-flag{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-left:5px;vertical-align:middle;box-shadow:0 0 0 2px rgba(67,160,71,.2)}
</style>
</head>
<body>
<div class="header">
  <div class="header-top">
    <div>
      <div class="header-title">🔍 促销政策查询</div>

</div>

<div class="quick-tags" id="quickTags">

</div>

<div class="results">
  <div class="result-info" id="resultInfo"></div>
  <div id="cardList"></div>
  <div class="empty" id="emptyState" style="display:none">

    <p style="font-size:12px;margin-top:4px">试试输入商品编码或更换关键字</p>
  </div>
</div>

<div class="footer">

: 11.0, "promoPrice": 16.5, "promoQty": 2.0, "comboRetail": null, "discount": 0.75, "remark": "", "note": "中价位、一线品牌、糖果", "priceDesc": "2件16.5元", "barcode": "6914782231832", "distribute": "6罐/店，城区、高速5S级门店及站外店共200座"}]}];
const CAT_EMOJI = {"水饮料": "💧", "酒类": "🍺", "茶叶": "🍵", "粮油副食": "🌾", "百货": "🧴", "食品": "🍪", "生鲜食品": "🥩", "汽车用品": "🚗", "其他": "📦"};
const ACT_EMOJI = {"百元三件": "💰", "加油换购": "⛽", "会员特惠": "👑", "98会员专享价": "💎", "组合促销": "🎁", "即时零售": "⚡", "抖音本地生活": "🎵", "企业微信": "💬", "新品促销": "🆕"};

let curCat = "全部", curAct = "全部", curKw = "";
const $ = id => document.getElementById(id);
const cardList = $("cardList"), emptyState = $("emptyState"), resultInfo = $("resultInfo");

$("totalCount").textContent = DATA.length + "个商品 · " + DATA.reduce((s,p)=>s+p.activities.length,0) + "条促销";

function fmtPrice(v) {
  if (v === null || v === undefined || v === "" || isNaN(v)) return "";
  return Number(v) % 1 === 0 ? String(Number(v)) : String(v);
}
function fmtDiscount(d) {
  if (!d || d > 1) return "";
  return (d * 10).toFixed(1) + "折";
}
function highlight(text, kw) {
  if (!kw || !kw.trim()) return text;
  try {
    const reg = new RegExp("(" + kw.trim().replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi");
    return text.replace(reg, '<span style="background:#c8e6c9;color:#1b5e20;font-weight:600;border-radius:2px;padding:0 2px">$1</span>');
  } catch(e) { return text; }
}

function filterProducts() {
  let list = DATA;
  if (curCat !== "全部") list = list.filter(p => p.category === curCat);
  if (curAct !== "全部") list = list.filter(p => p.activities.some(a => a.activity === curAct));
  if (curKw.trim()) {
    const kw = curKw.trim().toLowerCase();
    list = list.filter(p => {
      if (p.code.toLowerCase().includes(kw)) return true;
      if (p.name.toLowerCase().includes(kw)) return true;
      if (p.brand.toLowerCase().includes(kw)) return true;
      if (p.category.toLowerCase().includes(kw)) return true;
      return p.activities.some(a =>
        a.activity.toLowerCase().includes(kw) ||
        (a.activitySub || "").toLowerCase().includes(kw) ||
        (a.remark || "").toLowerCase().includes(kw) ||
        (a.note || "").toLowerCase().includes(kw)
      );
    });
  }
  return list;
}

function renderCards() {
  const list = filterProducts();
  resultInfo.textContent = `共 ${list.length} 个商品`;

  if (list.length === 0) {
    cardList.innerHTML = "";
    emptyState.style.display = "block";
    return;
  }
  emptyState.style.display = "none";

  cardList.innerHTML = list.map(p => {
    let acts = p.activities;
    if (curAct !== "全部") acts = acts.filter(a => a.activity === curAct);

    const actHtml = acts.map(a => {
      let priceHtml = "";
      if (a.priceDesc) {
        priceHtml = `<span class="act-price">${a.priceDesc}</span>`;
      } else if (a.promoPrice !== null && a.promoPrice !== undefined && a.promoPrice !== "") {
        priceHtml = `<span class="act-price">¥${fmtPrice(a.promoPrice)}</span>`;
      }
      let origHtml = "";
      if (a.origPrice !== null && a.origPrice !== undefined && a.origPrice !== "") {
        origHtml = `<span class="act-orig">原价¥${fmtPrice(a.origPrice)}</span>`;
      }
      const disc = fmtDiscount(a.discount);
      const discHtml = disc ? `<span class="act-discount">${disc}</span>` : "";

      let remark = a.remark || "";
      let badgeHtml = "";
      const badges = ["必选","主推必配","主推","重点主推","新增","延续","二选一","四选一"];
      for (const b of badges) {
        if (remark.includes(b) || (a.note||"").includes(b)) {
          badgeHtml += `<span class="act-badge ${b.replace(/必配|重点/g,'')}">${b}</span>`;
          break;
        }
      }

      let extra = "";
      if (a.ticket) extra += `<div class="act-remark">🎫 ${a.ticket}</div>`;
      if (remark && !["必选","主推必配","主推","重点主推","新增","延续","二选一","四选一"].includes(remark)) {
        extra += `<div class="act-remark">📝 ${remark}</div>`;
      }
      if (a.note && a.note !== remark && a.note.length < 50) {
        extra += `<div class="act-remark">💡 ${a.note}</div>`;
      }

      const sub = a.activitySub && a.activitySub !== a.activity ? ` · ${a.activitySub}` : "";
      return `<div class="activity-row">
        <span class="act-name">${ACT_EMOJI[a.activity]||""} ${a.activity}${sub}</span>
        <span class="act-info">${priceHtml}${origHtml}${discHtml}${badgeHtml}${extra}
        </span>
      </div>`;
    }).join("");

    const multiFlag = p.activities.length > 1 ? `<span class="mark-flag" title="${p.activities.length}个活动"></span>` : "";

    return `<div class="card" data-code="${p.code}">
      <div class="card-header">
        <div class="card-left">
          <div class="card-name">${highlight(p.name, curKw)}${multiFlag}</div>
          <div class="card-meta">
            <span>编码：${highlight(p.code, curKw)}</span>
            ${p.brand ? `<span>${highlight(p.brand, curKw)}</span>` : ""}
            <span>${p.activities.length}个活动</span>
          </div>
        </div>
        <span class="tag tag-${p.category}">${p.category}</span>
      </div>
      <div class="activity-list">${actHtml}</div>
    </div>`;
  }).join("");
}

$("searchInput").addEventListener("input", function() {
  curKw = this.value;
  $("searchClear").style.display = this.value ? "block" : "none";
  renderCards();
});
$("searchClear").addEventListener("click", function() {
  $("searchInput").value = ""; curKw = "";
  this.style.display = "none"; $("searchInput").focus(); renderCards();
});
$("catTabs").addEventListener("click", function(e) {
  const t = e.target.closest(".tab"); if (!t) return;
  this.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
  t.classList.add("active"); curCat = t.dataset.cat; renderCards();
});
$("actTabs").addEventListener("click", function(e) {
  const t = e.target.closest(".tab"); if (!t) return;
  this.querySelectorAll(".tab").forEach(x => x.classList.remove("act-active"));
  t.classList.add("act-active"); curAct = t.dataset.act; renderCards();
});
$("quickTags").addEventListener("click", function(e) {
  const t = e.target.closest(".quick-tag"); if (!t) return;
  $("searchInput").value = t.dataset.q; curKw = t.dataset.q;
  $("searchClear").style.display = "block"; renderCards();
  window.scrollTo({top:0, behavior:"smooth"});
});

renderCards();
</script>
