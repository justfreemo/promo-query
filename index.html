<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026年6-8月水饮节促销商品查询工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        
        .header h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .header p {
            color: #666;
            font-size: 14px;
        }
        
        .search-box {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        
        .search-row {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .search-input {
            flex: 1;
            padding: 12px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        .search-input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
        }
        
        .btn-secondary {
            background: #6c757d;
            padding: 8px 15px;
            font-size: 14px;
        }
        
        .filter-section {
            margin-bottom: 15px;
        }
        
        .filter-label {
            font-size: 14px;
            color: #666;
            font-weight: bold;
            margin-bottom: 10px;
            display: block;
        }
        
        .filter-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .filter-btn {
            padding: 10px 20px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            font-weight: 500;
        }
        
        .filter-btn:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
        }
        
        .filter-btn.active {
            background: #667eea;
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        .filter-btn.all-btn {
            border-color: #6c757d;
            color: #6c757d;
        }
        
        .filter-btn.all-btn:hover, .filter-btn.all-btn.active {
            background: #6c757d;
            color: white;
        }
        
        .highlight-btn {
            border-color: #e74c3c;
            color: #e74c3c;
            font-weight: bold;
        }
        
        .highlight-btn:hover, .highlight-btn.active {
            background: #e74c3c;
            color: white;
            box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4);
        }
        
        .jiti-btn {
            border-color: #d4a017;
            color: #d4a017;
            font-weight: bold;
        }
        
        .jiti-btn:hover, .jiti-btn.active {
            background: linear-gradient(135deg, #f0c040 0%, #d4a017 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(212, 160, 23, 0.4);
        }
        
        .results-info {
            background: white;
            padding: 15px 25px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .results-count {
            color: #667eea;
            font-weight: bold;
            font-size: 18px;
        }
        
        .results-table {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            overflow-x: auto;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }
        
        th:hover {
            background: rgba(255,255,255,0.1);
        }
        
        td {
            padding: 12px 15px;
            border-bottom: 1px solid #f0f0f0;
        }
        
        tr:hover {
            background: #f8f9ff;
        }
        
        .sheet-tag {
            display: inline-block;
            padding: 4px 12px;
            background: #667eea;
            color: white;
            border-radius: 20px;
            font-size: 12px;
            margin: 2px;
        }
        
        .sheet-tag.百元三件 {
            background: #e74c3c;
        }
        
        .sheet-tag.加油换购 {
            background: #f39c12;
        }
        
        .sheet-tag.会员特惠 {
            background: #27ae60;
        }
        
        .sheet-tag.计提标准 {
            background: #d4a017;
        }
        
        .price {
            color: #e74c3c;
            font-weight: bold;
            font-size: 16px;
        }
        
        .jiti-price {
            color: #d4a017;
            font-weight: bold;
            font-size: 16px;
        }
        
        .original-price {
            color: #999;
            text-decoration: line-through;
            font-size: 12px;
        }
        
        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: #999;
            font-size: 18px;
        }
        
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #667eea;
            font-size: 18px;
        }
        
        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 20px;
            background: white;
            border-radius: 0 0 15px 15px;
        }
        
        .page-btn {
            padding: 8px 15px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .page-btn:hover, .page-btn.active {
            background: #667eea;
            color: white;
        }
        
        .detail-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .detail-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 800px;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .detail-content h2 {
            color: #667eea;
            margin-bottom: 20px;
        }
        
        .detail-row {
            display: flex;
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .detail-label {
            font-weight: bold;
            min-width: 150px;
            color: #666;
        }
        
        .detail-value-jiti {
            color: #d4a017;
            font-weight: bold;
        }
        
        .close-btn {
            float: right;
            font-size: 24px;
            cursor: pointer;
            color: #999;
        }
        
        .close-btn:hover {
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛒 2026年6-8月水饮节促销商品查询工具</h1>
            <p>根据关键字查询商品促销价、营销政策、计提标准等信息</p>
        </div>
        
        <div class="search-box">
            <div class="search-row">
                <input type="text" class="search-input" id="searchInput" placeholder="输入商品名称、品牌、品类或商品编码...">
                <button class="btn" onclick="search()">🔍 搜索</button>
                <button class="btn btn-secondary" onclick="resetSearch()">重置</button>
            </div>
            
            <div class="filter-section">
                <label class="filter-label">🎯 营销活动</label>
                <div class="filter-buttons" id="activityButtons">
                    <button class="filter-btn all-btn active" onclick="filterByActivity('')">全部活动</button>
                    <button class="filter-btn highlight-btn" onclick="filterByActivity('百元三件')">百元三件</button>
                    <button class="filter-btn highlight-btn" onclick="filterByActivity('加油换购')">加油换购</button>
                    <button class="filter-btn highlight-btn" onclick="filterByActivity('会员特惠')">会员特惠</button>
                    <button class="filter-btn jiti-btn" onclick="filterByActivity('计提标准')">💰 计提标准</button>
                </div>
            </div>
            
            <div class="filter-section">
                <label class="filter-label">📦 品类筛选</label>
                <div class="filter-buttons" id="categoryButtons">
                    <button class="filter-btn all-btn active" onclick="filterByCategory('')">全部分类</button>
                </div>
            </div>
        </div>
        
        <div class="results-info">
            <div>
                <span class="results-count" id="resultsCount">加载中...</span>
                <span id="resultsText"></span>
            </div>
            <div>
                <button class="btn btn-secondary" onclick="exportResults()">📥 导出结果</button>
            </div>
        </div>
        
        <div class="results-table">
            <div class="loading" id="loading">正在加载数据...</div>
            <table id="resultsTable" style="display: none;">
                <thead id="tableHead">
                </thead>
                <tbody id="resultsBody">
                </tbody>
            </table>
            <div class="no-results" id="noResults" style="display: none;">
                没有找到匹配的商品，请尝试其他关键字
            </div>
            <div class="pagination" id="pagination" style="display: none;"></div>
        </div>
    </div>
    
    <div class="detail-modal" id="detailModal">
        <div class="detail-content">
            <span class="close-btn" onclick="closeDetail()">&times;</span>
            <h2 id="detailTitle">商品详情</h2>
            <div id="detailBody"></div>
        </div>
    </div>
    
    <script src="data.js"></script>
    <script>
        let allData = [];
        let jitiData = [];  // 计提标准专用数据
        let filteredData = [];
        let currentPage = 1;
        const itemsPerPage = 20;
        let currentSort = { col: -1, asc: true };
        let currentActivity = '';
        let currentCategory = '';
        let isJitiMode = false;
        
        // 加载数据
        function loadData() {
            allData = [];
            jitiData = [];
            
            // 从data.js中读取数据
            for (let sheetName in window.excelData) {
                let sheet = window.excelData[sheetName];
                
                if (sheetName === '计提标准') {
                    // 计提标准数据单独存储
                    sheet.data.forEach(row => {
                        row._sheet = sheetName;
                        jitiData.push(row);
                    });
                } else {
                    // 其他活动数据
                    sheet.data.forEach(row => {
                        row._sheet = sheetName;
                        allData.push(row);
                    });
                }
            }
            
            // 填充筛选器
            populateFilters();
            
            // 显示所有数据
            filteredData = allData;
            displayResults();
            
            document.getElementById('loading').style.display = 'none';
            document.getElementById('resultsTable').style.display = 'table';
        }
        
        // 填充筛选器
        function populateFilters() {
            let categories = new Set();
            
            allData.forEach(row => {
                let category = row['品类'] || row['营销类别'] || '';
                if (category) categories.add(category);
            });
            
            // 计提标准数据也加入品类
            jitiData.forEach(row => {
                let category = row['品类'] || '';
                if (category) categories.add(category);
            });
            
            // 只显示指定的品类
            let allowedCategories = ['水饮料', '粮油副食', '酒类', '食品', '百货', '环保化工'];
            
            // 填充品类按钮
            let categoryButtons = document.getElementById('categoryButtons');
            allowedCategories.forEach(c => {
                if (categories.has(c)) {
                    let btn = document.createElement('button');
                    btn.className = 'filter-btn';
                    btn.textContent = c;
                    btn.onclick = () => filterByCategory(c);
                    categoryButtons.appendChild(btn);
                }
            });
        }
        
        // 按活动筛选
        function filterByActivity(activity) {
            currentActivity = activity;
            isJitiMode = (activity === '计提标准');
            
            // 更新按钮状态
            let buttons = document.querySelectorAll('#activityButtons .filter-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            performFilter();
        }
        
        // 按品类筛选
        function filterByCategory(category) {
            currentCategory = category;
            
            // 更新按钮状态
            let buttons = document.querySelectorAll('#categoryButtons .filter-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            performFilter();
        }
        
        // 搜索
        function search() {
            performFilter();
        }
        
        // 执行筛选
        function performFilter() {
            let keyword = document.getElementById('searchInput').value.trim().toLowerCase();
            
            // 选择数据源
            let dataSource = isJitiMode ? jitiData : allData;
            
            filteredData = dataSource.filter(row => {
                // 关键字搜索
                if (keyword) {
                    let searchText = '';
                    for (let key in row) {
                        if (row[key]) searchText += row[key].toLowerCase() + ' ';
                    }
                    if (!searchText.includes(keyword)) return false;
                }
                
                // 活动筛选（非计提模式）
                if (!isJitiMode && currentActivity) {
                    let rowActivity = row['活动类型'] || row._sheet || '';
                    if (!rowActivity.includes(currentActivity)) return false;
                }
                
                // 品类筛选
                if (currentCategory) {
                    let rowCategory = row['品类'] || row['营销类别'] || '';
                    if (rowCategory !== currentCategory) return false;
                }
                
                return true;
            });
            
            currentPage = 1;
            displayResults();
        }
        
        // 渲染表头
        function renderTableHead() {
            let thead = document.getElementById('tableHead');
            
            if (isJitiMode) {
                thead.innerHTML = `
                    <tr>
                        <th onclick="sortTable(0)">#</th>
                        <th onclick="sortTable(1)">品类</th>
                        <th onclick="sortTable(2)">类型</th>
                        <th onclick="sortTable(3)">商品编码</th>
                        <th onclick="sortTable(4)">商品名称</th>
                        <th onclick="sortTable(5)">计提标准(元)</th>
                        <th onclick="sortTable(6)">计提系数</th>
                        <th>备注</th>
                        <th>操作</th>
                    </tr>
                `;
            } else {
                thead.innerHTML = `
                    <tr>
                        <th onclick="sortTable(0)">#</th>
                        <th onclick="sortTable(1)">营销活动</th>
                        <th onclick="sortTable(2)">品牌</th>
                        <th onclick="sortTable(3)">品类</th>
                        <th onclick="sortTable(4)">商品名称</th>
                        <th onclick="sortTable(5)">商品编码</th>
                        <th onclick="sortTable(6)">原价</th>
                        <th onclick="sortTable(7)">促销价</th>
                        <th onclick="sortTable(8)">折扣力度</th>
                        <th>操作</th>
                    </tr>
                `;
            }
        }
        
        // 显示结果
        function displayResults() {
            let tbody = document.getElementById('resultsBody');
            tbody.innerHTML = '';
            
            // 渲染表头
            renderTableHead();
            
            let count = filteredData.length;
            document.getElementById('resultsCount').textContent = `找到 ${count} 个商品`;
            
            if (count === 0) {
                document.getElementById('resultsTable').style.display = 'none';
                document.getElementById('noResults').style.display = 'block';
                document.getElementById('pagination').style.display = 'none';
                return;
            }
            
            document.getElementById('resultsTable').style.display = 'table';
            document.getElementById('noResults').style.display = 'none';
            
            // 分页
            let start = (currentPage - 1) * itemsPerPage;
            let end = Math.min(start + itemsPerPage, count);
            let pageData = filteredData.slice(start, end);
            
            if (isJitiMode) {
                displayJitiTable(pageData, start);
            } else {
                displayNormalTable(pageData, start);
            }
            
            // 分页控件
            updatePagination(count);
        }
        
        // 显示计提标准表格
        function displayJitiTable(pageData, start) {
            let tbody = document.getElementById('resultsBody');
            
            pageData.forEach((row, idx) => {
                let tr = document.createElement('tr');
                
                // 序号
                let td0 = document.createElement('td');
                td0.textContent = start + idx + 1;
                tr.appendChild(td0);
                
                // 品类
                let td1 = document.createElement('td');
                td1.textContent = row['品类'] || '-';
                tr.appendChild(td1);
                
                // 类型
                let td2 = document.createElement('td');
                let typeVal = row['类型'] || '-';
                let typeColor = typeVal === '培育' ? '#27ae60' : typeVal === '新品' ? '#3498db' : typeVal === '创效' ? '#e74c3c' : '#333';
                td2.innerHTML = `<span style="color:${typeColor};font-weight:bold;">${typeVal}</span>`;
                tr.appendChild(td2);
                
                // 商品编码
                let td3 = document.createElement('td');
                td3.textContent = row['商品编码'] || '-';
                td3.style.fontFamily = 'monospace';
                tr.appendChild(td3);
                
                // 商品名称
                let td4 = document.createElement('td');
                td4.textContent = row['商品名称'] || '-';
                td4.style.fontWeight = 'bold';
                tr.appendChild(td4);
                
                // 计提标准(元)
                let td5 = document.createElement('td');
                let jitiVal = row['计提标准(元)'] || '';
                td5.innerHTML = jitiVal ? `<span class="jiti-price">¥${jitiVal}</span>` : '-';
                tr.appendChild(td5);
                
                // 计提系数
                let td6 = document.createElement('td');
                let coefVal = row['计提系数'] || '1';
                td6.textContent = coefVal;
                td6.style.textAlign = 'center';
                tr.appendChild(td6);
                
                // 备注
                let td7 = document.createElement('td');
                let remarkVal = row['备注'] || '';
                let remarkColor = remarkVal.includes('新增') ? '#27ae60' : 
                                  remarkVal.includes('上调') ? '#e74c3c' : 
                                  remarkVal.includes('下调') ? '#f39c12' : '#666';
                td7.innerHTML = remarkVal ? `<span style="color:${remarkColor};font-size:12px;">${remarkVal}</span>` : '-';
                tr.appendChild(td7);
                
                // 操作
                let td8 = document.createElement('td');
                let btn = document.createElement('button');
                btn.className = 'btn btn-secondary';
                btn.style.padding = '5px 10px';
                btn.style.fontSize = '12px';
                btn.textContent = '详情';
                btn.onclick = () => showDetail(row);
                td8.appendChild(btn);
                tr.appendChild(td8);
                
                tbody.appendChild(tr);
            });
        }
        
        // 显示普通促销表格
        function displayNormalTable(pageData, start) {
            let tbody = document.getElementById('resultsBody');
            
            pageData.forEach((row, idx) => {
                let tr = document.createElement('tr');
                
                // 序号
                let td1 = document.createElement('td');
                td1.textContent = start + idx + 1;
                tr.appendChild(td1);
                
                // 营销活动
                let td2 = document.createElement('td');
                let activity = row['活动类型'] || row._sheet || '';
                let activityClass = activity.includes('百元三件') ? '百元三件' : 
                                   activity.includes('加油换购') ? '加油换购' : 
                                   activity.includes('会员特惠') ? '会员特惠' : '';
                td2.innerHTML = `<span class="sheet-tag ${activityClass}">${activity}</span>`;
                tr.appendChild(td2);
                
                // 品牌
                let td3 = document.createElement('td');
                td3.textContent = row['品牌'] || '-';
                tr.appendChild(td3);
                
                // 品类
                let td4 = document.createElement('td');
                td4.textContent = row['品类'] || row['营销类别'] || '-';
                tr.appendChild(td4);
                
                // 商品名称
                let td5 = document.createElement('td');
                let name = row['商品名称'] || '-';
                td5.textContent = name;
                td5.style.fontWeight = 'bold';
                tr.appendChild(td5);
                
                // 商品编码
                let td6 = document.createElement('td');
                td6.textContent = row['商品编码'] || '-';
                td6.style.fontFamily = 'monospace';
                tr.appendChild(td6);
                
                // 原价
                let td7 = document.createElement('td');
                let originalPrice = row['非高速零售价'] || row['零售价（元）'] || row['最低零售价'] || row['非高速零售价\n（元）'] || '';
                td7.innerHTML = originalPrice ? `<span class="original-price">${originalPrice}</span>` : '-';
                tr.appendChild(td7);
                
                // 促销价
                let td8 = document.createElement('td');
                let promoPrice = row['组合促销价'] || row['促销价（元）'] || row['单品促销价'] || row['换购总价\n（元）'] || '';
                td8.innerHTML = promoPrice ? `<span class="price">¥${promoPrice}</span>` : '-';
                tr.appendChild(td8);
                
                // 折扣力度
                let td9 = document.createElement('td');
                let discount = row['折扣力度'] || '';
                if (discount && !isNaN(discount)) {
                    let disc = parseFloat(discount);
                    td9.textContent = `${(disc * 10).toFixed(1)}折`;
                    td9.style.color = disc < 0.7 ? '#e74c3c' : '#333';
                    td9.style.fontWeight = 'bold';
                } else {
                    td9.textContent = '-';
                }
                tr.appendChild(td9);
                
                // 操作
                let td10 = document.createElement('td');
                let btn = document.createElement('button');
                btn.className = 'btn btn-secondary';
                btn.style.padding = '5px 10px';
                btn.style.fontSize = '12px';
                btn.textContent = '详情';
                btn.onclick = () => showDetail(row);
                td10.appendChild(btn);
                tr.appendChild(td10);
                
                tbody.appendChild(tr);
            });
        }
        
        // 更新分页
        function updatePagination(total) {
            let pagination = document.getElementById('pagination');
            let totalPages = Math.ceil(total / itemsPerPage);
            
            if (totalPages <= 1) {
                pagination.style.display = 'none';
                return;
            }
            
            pagination.style.display = 'flex';
            pagination.innerHTML = '';
            
            // 上一页
            if (currentPage > 1) {
                let btn = document.createElement('button');
                btn.className = 'page-btn';
                btn.textContent = '上一页';
                btn.onclick = () => { currentPage--; displayResults(); };
                pagination.appendChild(btn);
            }
            
            // 页码
            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || Math.abs(i - currentPage) <= 2) {
                    let btn = document.createElement('button');
                    btn.className = 'page-btn' + (i === currentPage ? ' active' : '');
                    btn.textContent = i;
                    btn.onclick = () => { currentPage = i; displayResults(); };
                    pagination.appendChild(btn);
                } else if (Math.abs(i - currentPage) === 3) {
                    let span = document.createElement('span');
                    span.textContent = '...';
                    span.style.padding = '8px';
                    pagination.appendChild(span);
                }
            }
            
            // 下一页
            if (currentPage < totalPages) {
                let btn = document.createElement('button');
                btn.className = 'page-btn';
                btn.textContent = '下一页';
                btn.onclick = () => { currentPage++; displayResults(); };
                pagination.appendChild(btn);
            }
        }
        
        // 显示详情
        function showDetail(row) {
            let title = document.getElementById('detailTitle');
            let body = document.getElementById('detailBody');
            
            title.textContent = row['商品名称'] || '商品详情';
            
            body.innerHTML = '';
            for (let key in row) {
                if (key.startsWith('_') || key === 'col_0') continue;
                
                let div = document.createElement('div');
                div.className = 'detail-row';
                
                let label = document.createElement('div');
                label.className = 'detail-label';
                label.textContent = key;
                
                let value = document.createElement('div');
                let val = row[key] || '-';
                
                // 计提相关字段高亮显示
                if (key.includes('计提')) {
                    value.className = 'detail-value-jiti';
                    if (key.includes('标准') && val !== '-') {
                        val = '¥' + val;
                    }
                }
                
                value.textContent = val;
                
                div.appendChild(label);
                div.appendChild(value);
                body.appendChild(div);
            }
            
            document.getElementById('detailModal').style.display = 'flex';
        }
        
        // 关闭详情
        function closeDetail() {
            document.getElementById('detailModal').style.display = 'none';
        }
        
        // 重置搜索
        function resetSearch() {
            document.getElementById('searchInput').value = '';
            currentActivity = '';
            currentCategory = '';
            isJitiMode = false;
            
            // 重置按钮状态
            document.querySelectorAll('#activityButtons .filter-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector('#activityButtons .filter-btn.all-btn').classList.add('active');
            
            document.querySelectorAll('#categoryButtons .filter-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector('#categoryButtons .filter-btn.all-btn').classList.add('active');
            
            filteredData = allData;
            currentPage = 1;
            displayResults();
        }
        
        // 排序
        function sortTable(colIdx) {
            if (currentSort.col === colIdx) {
                currentSort.asc = !currentSort.asc;
            } else {
                currentSort.col = colIdx;
                currentSort.asc = true;
            }
            
            if (isJitiMode) {
                // 计提模式排序
                let keyMap = ['', '品类', '类型', '商品编码', '商品名称', '计提标准(元)', '计提系数'];
                let key = keyMap[colIdx];
                if (key) {
                    filteredData.sort((a, b) => {
                        let va = (a[key] || '').toString();
                        let vb = (b[key] || '').toString();
                        // 数字排序
                        if (key === '计提标准(元)' || key === '计提系数') {
                            let na = parseFloat(va) || 0;
                            let nb = parseFloat(vb) || 0;
                            return currentSort.asc ? na - nb : nb - na;
                        }
                        return currentSort.asc ? va.localeCompare(vb, 'zh-CN') : vb.localeCompare(va, 'zh-CN');
                    });
                }
            } else {
                let keyMap = ['', '活动类型', '品牌', '品类', '商品名称', '商品编码', '非高速零售价', '组合促销价', '折扣力度'];
                let key = keyMap[colIdx];
                if (key) {
                    filteredData.sort((a, b) => {
                        let va = (a[key] || '').toString();
                        let vb = (b[key] || '').toString();
                        return currentSort.asc ? va.localeCompare(vb, 'zh-CN') : vb.localeCompare(va, 'zh-CN');
                    });
                }
            }
            
            displayResults();
        }
        
        // 导出结果
        function exportResults() {
            let csv = '\ufeff'; // BOM for Excel
            
            if (isJitiMode) {
                // 计提标准导出
                csv += '品类,类型,商品编码,商品名称,单位,计提标准(元),计提系数,备注\n';
                filteredData.forEach(row => {
                    csv += `"${row['品类'] || ''}","${row['类型'] || ''}","${row['商品编码'] || ''}","${row['商品名称'] || ''}","${row['单位'] || ''}","${row['计提标准(元)'] || ''}","${row['计提系数'] || '1'}","${row['备注'] || ''}"\n`;
                });
            } else {
                // 普通导出
                csv += '营销活动,品牌,品类,商品名称,商品编码,原价,促销价,折扣力度,计提标准(元),计提系数\n';
                filteredData.forEach(row => {
                    let activity = row['活动类型'] || row._sheet || '';
                    let brand = row['品牌'] || '';
                    let category = row['品类'] || row['营销类别'] || '';
                    let name = row['商品名称'] || '';
                    let code = row['商品编码'] || '';
                    let originalPrice = row['非高速零售价'] || row['零售价（元）'] || row['最低零售价'] || '';
                    let promoPrice = row['组合促销价'] || row['促销价（元）'] || row['单品促销价'] || '';
                    let discount = row['折扣力度'] || '';
                    let jitiStd = row['计提标准(元)'] || '';
                    let jitiCoef = row['计提系数'] || '';
                    
                    if (discount && !isNaN(discount)) {
                        discount = (parseFloat(discount) * 10).toFixed(1) + '折';
                    }
                    
                    csv += `"${activity}","${brand}","${category}","${name}","${code}","${originalPrice}","${promoPrice}","${discount}","${jitiStd}","${jitiCoef}"\n`;
                });
            }
            
            let blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            let link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = isJitiMode ? '计提标准查询结果.csv' : '促销商品查询结果.csv';
            link.click();
        }
        
        // 回车搜索
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') search();
        });
        
        // 点击弹窗外部关闭
        document.getElementById('detailModal').addEventListener('click', function(e) {
            if (e.target === this) closeDetail();
        });
        
        // 加载数据
        window.onload = function() {
            if (window.excelData) {
                loadData();
            } else {
                document.getElementById('loading').textContent = '数据加载失败，请确保data.js文件存在';
            }
        };
    </script>
</body>
</html>
